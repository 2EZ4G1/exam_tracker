databases:
  - name: examtrackerdb
    plan: free
    databaseName: examtracker
    user: examtracker
services:
  - type: web
    plan: free
    name: ExamTracker
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn ExamTracker.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: examtrackerdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
